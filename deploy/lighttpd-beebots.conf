# Reviewed template; do not enable until deployment is authorised.
# mod_proxy must already be loaded (it is on the inspected server).
# Every request, including static assets and SSE, reaches the backend's Basic
# authentication. No direct filesystem alias exposes app/config files.
$HTTP["host"] == "example.com" {
  $HTTP["url"] == "/beebots" {
    url.redirect = ( "^/beebots$" => "/beebots/" )
  }
  $HTTP["url"] =~ "^/beebots/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 8788 )) )
    server.stream-response-body = 2
  }
}
# Keep the site's existing HTTP→HTTPS redirect. Do not expose backend port 8788.
